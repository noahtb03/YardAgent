<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YardAgent · Photo analysis</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 64px auto; padding: 0 24px; color: #193329; background: #f6f8f5; }
    form { display: grid; gap: 16px; padding: 24px; border: 1px solid #cad6cd; border-radius: 12px; background: white; }
    input, button { font: inherit; }
    button { padding: 12px; border: 0; border-radius: 6px; color: white; background: #256447; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { padding: 20px; border-radius: 8px; background: #e7eee8; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Photo analysis</h1>
  <p>Upload an image to see its format, dimensions, color mode, and file size.</p>
  <form id="upload-form" action="/analyze" method="post" enctype="multipart/form-data">
    <label for="photo">Choose a photo (up to 10 MiB)</label>
    <input id="photo" name="file" type="file" accept="image/*" required>
    <button id="submit" type="submit">Analyze photo</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <pre id="response" aria-label="JSON response" hidden></pre>
  <script>
    const form = document.querySelector('#upload-form');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const output = document.querySelector('#response');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      output.hidden = true;
      const file = document.querySelector('#photo').files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        status.textContent = 'Image must be 10 MiB or smaller.';
        return;
      }
      button.disabled = true;
      status.textContent = 'Analyzing photo…';
      try {
        const response = await fetch('/analyze', { method: 'POST', body: new FormData(form) });
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.hidden = false;
        status.textContent = response.ok ? 'Analysis complete.' : 'Upload failed. See the response below.';
      } catch (error) {
        status.textContent = 'Could not reach the server or read its response. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
